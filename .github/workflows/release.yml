name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for npm's OIDC trusted publisher — no NPM_TOKEN needed, npm
  # exchanges this job's OIDC token for a short-lived publish credential.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Quality gate (format, lint, typecheck, test, build)
        run: bun run check

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
